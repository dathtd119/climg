# climg vendors - display vendor of every LabHub / local record (`climg search --vendor`, `index --json` vendors).
#
#   display   kinds.yaml `vendor` -> display name. Buildable records (and local images) take their vendor from the kind;
#             a kind vendor not listed here is shown capitalised.
#   folders   ordered rules over the LabHub folder path below /addons (`qemu` is dropped: `H3C/vSR`, `Cisco ASAv`,
#             `iol/bin`, `dynamips`); first match wins. Case-insensitive, searched from the start of the path.
#   names     ordered rules over the LabHub entry name, used when no folder rule matched (many folders are bare image
#             names such as `asav-9-20-2`). First match wins.
#   Nothing matching -> `Other`. Keep that list empty-ish: add a rule rather than let an entry fall through.
#
# hpvsr-* images are filed under H3C: the VSR is the Comware router that H3C develops and HPE resold.

display:
  cisco: Cisco
  juniper: Juniper
  arista: Arista
  nokia: Nokia
  huawei: Huawei
  fortinet: Fortinet
  paloalto: Palo Alto

folders:
  - {re: '^(Cisco|CCIE|iol/|dynamips)', vendor: Cisco}
  - {re: '^(Juniper|Junos)', vendor: Juniper}
  - {re: '^H3C', vendor: H3C}
